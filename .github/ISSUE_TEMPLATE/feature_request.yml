name: Feature request
description: Suggest a focused improvement to the reading or research workflow.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current workflow gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Include any simpler alternatives you considered.
    validations:
      required: true
