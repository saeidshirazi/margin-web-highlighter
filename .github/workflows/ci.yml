name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARGIN_LIVE_TRANSLATION_TEST: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run format:check
      - run: npm run check:docs
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - run: npm run test:experience
      - run: npm run test:organization
      - run: npm run test:research
      - run: npm run test:native
      - run: npm run test:drive
      - run: npm run build:edge && npm run build:firefox
        env:
          MARGIN_GOOGLE_WEB_CLIENT_ID: 123-ci-fixture.apps.googleusercontent.com
      - run: npm run lint:firefox
      - run: npm run test:firefox
      - run: npm run test:firefox:drive
        env:
          MARGIN_CROSS_CHROMIUM: chromium
      - run: npm run package:public
      - run: npm run verify:release
      - run: npm run test:drive:public

  desktop-browsers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chrome, edge, brave, firefox]
    env:
      MARGIN_TEST_BROWSER: ${{ matrix.browser }}
      MARGIN_LIVE_TRANSLATION_TEST: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.browser == 'chrome'
        run: npx playwright install --with-deps chromium
      - if: matrix.browser == 'firefox'
        run: npx playwright install --with-deps firefox
      - if: matrix.browser == 'edge' && runner.os == 'macOS'
        run: test -d '/Applications/Microsoft Edge.app' || brew install --cask microsoft-edge
      - if: matrix.browser == 'brave' && runner.os == 'macOS'
        run: brew install --cask brave-browser
      - if: matrix.browser == 'brave' && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'brave.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'brave-browser'
          gh release download --repo brave/brave-browser --pattern 'brave-v*-win32-x64.zip' --output $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $binary = Get-ChildItem -LiteralPath $folder -Filter brave.exe -Recurse -File | Select-Object -First 1
          if (!$binary) { throw 'Brave executable missing from release archive' }
          "MARGIN_BRAVE_BINARY=$($binary.FullName)" >> $env:GITHUB_ENV
      - if: matrix.browser == 'brave' && runner.os == 'Linux'
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update
          sudo apt-get install -y brave-browser
      - run: node scripts/build.mjs --target=${{ matrix.browser }}
        env:
          MARGIN_GOOGLE_WEB_CLIENT_ID: 123-ci-fixture.apps.googleusercontent.com
      - if: matrix.browser != 'firefox'
        run: npm run test:research
      - if: matrix.browser == 'firefox'
        run: npm run test:firefox
