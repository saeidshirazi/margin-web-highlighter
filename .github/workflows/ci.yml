name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARGIN_LIVE_TRANSLATION_TEST: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run format:check
      - run: npm run check:docs
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - run: npm run test:experience
      - run: npm run test:organization
      - run: npm run test:research
      - run: npm run test:native
      - run: npm run test:drive
      - run: npm run build:edge && npm run build:firefox
        env:
          MARGIN_GOOGLE_WEB_CLIENT_ID: 123-ci-fixture.apps.googleusercontent.com
      - run: npm run lint:firefox
      - run: npm run test:firefox
      - run: npm run test:firefox:drive
        env:
          MARGIN_CROSS_CHROMIUM: chromium
      - run: npm run package:public
      - run: npm run verify:release
      - run: npm run test:drive:public
